# =============================================================================
# tmux configuration — optimized for AI CLI workflows (Claude, Codex, etc.)
# =============================================================================

# =============================================================================
# 2. PREFIX & SPLIT BINDINGS
# =============================================================================
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
unbind '"'
unbind %

bind c new-window -c "#{pane_current_path}"

# =============================================================================
# 3. AI CLI OPTIMIZATIONS
# =============================================================================
set -g history-limit 10000
set -sg escape-time 0
set -s focus-events on

# =============================================================================
# 4. TERMINAL & COLORS
# =============================================================================
setw -q -g utf8 on
set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-255color:Tc"
set-option -sa terminal-overrides ",xterm*:Tc"

set -g base-index 1
setw -g pane-base-index 1

# =============================================================================
# 5. MOUSE & COPY MODE
# =============================================================================
set -g mouse on
bind m run "~/.tmux_helpers.sh _toggle_mouse"

set -g monitor-activity on
setw -g monitor-activity on

bind r source-file ~/.tmux.conf \; display-message "[+] tmux configuration reloaded"

set-window-option -g mode-keys vi

bind Enter copy-mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# =============================================================================
# 6. PANES & WINDOWS
# =============================================================================
set -g renumber-windows on
setw -g automatic-rename on

set -g pane-border-style bg=colour232,fg=colour239
set -g pane-active-border-style bg=colour232,fg=colour33

set -g message-style bg="#000000",fg="#ffffff",bold
set -g mode-style fg="#000000",bg="#ffd700"

# =============================================================================
# 7. STATUS BAR
# =============================================================================
set -g status-fg "#ffffff"
set -g status-bg "#222222"

set -g status-justify left
set -g status-position bottom
set -g status-right-length 150
set -g status-left-length 150

# Session name
set -g status-left  '#[bg=#2f2f2f,fg=#ffffff,bold] + #S #[bg=#000000]#[fg=#444444] '

# Username + hostname + time + date
# Call helpers as shell commands (not source-file) so tmux doesn't parse their contents
set -g status-right '#[bg=#222222]#[fg=#ffffff,bold] #(/bin/bash ~/.tmux_helpers.sh _username #{pane_tty})#[fg=#ffffff,bold] • #[bg=#222222,fg=#ffffff,bold]#(/bin/bash ~/.tmux_helpers.sh _hostname #{pane_tty}) #[bg=#444444]#[fg=#ffffff] #[fg=#efefef,bold]%I:%M %p#[fg=#ffffff] #[bg=#222222]#[fg=#ffffff] %Y-%m-%d #[fg=#A30000]#[bg=#A30000] '

# Active window
setw -g window-status-current-style bg="#000000",fg="#ffffff",bold
setw -g window-status-current-format '#[bg=#203ebf,fg=#ffffff] #I #[bg=#333333,fg=#ffffff] #W #[fg=colour33]#F '

# Inactive window
setw -g window-status-style bg="#000000",fg="#ffffff",none
setw -g window-status-format '#[bg=#202020]#[fg=colour25] #I #[bg=#222222]#[fg=#888888] #W #[fg=colour25]#F '

# Activity & bell
setw -g window-status-activity-style bg="#222222",fg="colour33",none
setw -g window-status-bell-style bg="#941C2F",fg="#ffffff",none

# =============================================================================
# 8. PLUGINS
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'
